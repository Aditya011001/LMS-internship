<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-LearnFlow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="logo1"><i>|~</i>LearnFlow</div>
    <section class="login">
        <div class="login-box">
            <h1>Welcome to LearnFlow....</h1>
            <label for="user-mail">Email</label>
            <input type="Email" id="user-mail" placeholder="Email" required>
            <label for="user-password">Password</label>
            <input type="password" id="user-password" placeholder="Password" required>
            <a href="#">Forget Password?</a>
            <button class="login-btn">Login</button>
            <a href="/register.html">Don't have an account? Register</a>
        </div>
    </section>
    <script src="storage.js"></script>
    <script src="script.js"></script>
</body>
</html>

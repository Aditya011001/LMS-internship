<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LearnFlow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400..800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav>
        <div class="logo"><i class="fa-solid fa-code"></i>LearnFlow</div>
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Courses...">
                <button onclick="searchCourses()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>
        <ul class="navLinks">
            <li><a href="dashboard.html">Home</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="bookmarks.html">Bookmarks</a></li>
            <li><i class="fa-solid fa-moon icon" onclick="toggleTheme()"></i></li>
            <li id="logout"><span>Logout</span><i class="fa-solid fa-right-from-bracket"></i></li>
        </ul>
    </nav>

    <section class="welcome">
        <div id="welcomeMessage">
            <p class="welcome-line">Welcome back, {name}!</p>
            <p class="welcome-line">You're making solid progress — keep it up.</p>
            <p class="welcome-line">Let's pick up where you left off.</p>
        </div>
    </section>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="dashboard.html" class="sidebar-link active">Dashboard</a>
            <a href="courses.html" class="sidebar-link">Courses</a>
            <a href="bookmarks.html" class="sidebar-link">Bookmarks</a>
            <a href="profile.html" class="sidebar-link">Profile</a>
        </aside>

        <main class="dashboard-main">
            <section class="stats-row">
                <div class="stat-card">
                    <p class="stat-label">Enrolled courses</p>
                    <p class="stat-value" id="statEnrolled">0</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Average progress</p>
                    <p class="stat-value" id="statProgress">0%</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Quizzes taken</p>
                    <p class="stat-value" id="statQuizzes">0</p>
                </div>
            </section>

            <section class="enrolled-courses">
                <h2>Your Courses</h2>
                <div id="courseList"></div>
            </section>

            <section class="notifications">
                <h2>Recent Activity</h2>
                <div id="notificationList"></div>
            </section>
        </main>
    </div>

    <script src="storage.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register-LearnFlow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400..800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="logo"><i class="fa-solid fa-code"></i>LearnFlow</div>
    <section class="register">
        <div class="register-box">
            <h1>Welcome to LearnFlow....</h1>
            <label for="user-name">Name</label>
            <input type="text" id="user-name" placeholder="Enter your name" required>
            <label for="user-mail">Email</label>
            <input type="Email" id="user-mail" placeholder="Enter E-mail" required>
            <label for="user-password">Password</label>
            <input type="password" id="user-password" placeholder="Choose a Password" required>
            <button class="register-btn">Register</button>
            <a href="/login.html">Already have an account. Login</a>
        </div>
    </section>
    <script src="storage.js"></script>
    <script src="script.js"></script>
</body>

</html>
